# ─── Local "just run it" profile ─────────────────────────────────────────────
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=local
# Uses an in-memory H2 database (PostgreSQL compatibility mode) so no external
# database is needed. DataSeeder populates demo users, products, categories, and
# suppliers on startup. Data resets each restart — perfect for a quick check.

spring.datasource.url=jdbc:h2:mem:stockbase;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Dev-only secret so JwtUtil can build its signing key (never used in production).
app.jwt.secret=local-dev-only-secret-key-at-least-256-bits-long-0123456789abcdef
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:3000

management.endpoints.web.exposure.include=health,info
