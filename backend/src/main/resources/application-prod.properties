# Production settings — set these as environment variables on Render/Railway
# DATABASE_URL, JWT_SECRET, CORS_ORIGINS

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ORIGINS:https://your-app.netlify.app}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator — /actuator/health is public (used by Render health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.notifications.webhook-url=${NOTIFICATIONS_WEBHOOK_URL:}
app.notifications.cron=0 0 * * * *
