# ─── Local Development ───────────────────────────────────────────────────────
# Copy this file to src/main/resources/application.properties and fill in your values.

spring.datasource.url=jdbc:postgresql://localhost:5432/stockbase
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# All entity associations are EAGER, so disable open-session-in-view: no DB
# queries during response rendering, and lazy-loading surprises can't sneak in.
spring.jpa.open-in-view=false

app.jwt.secret=please-change-this-to-a-256-bit-secret-before-going-to-production
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:3000

server.port=8080

# Actuator — expose health/info for uptime checks and load balancers
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# External low-stock notifications: Slack/Teams-compatible webhook URL.
# Empty = disabled (the notifier logs instead of calling out). Set via env in prod.
app.notifications.webhook-url=${NOTIFICATIONS_WEBHOOK_URL:}
app.notifications.cron=0 0 * * * *

# springdoc / Swagger UI available at /swagger-ui.html
