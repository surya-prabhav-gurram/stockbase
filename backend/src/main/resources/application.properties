# ─── Local Development ───────────────────────────────────────────────────────
# Copy this file to src/main/resources/application.properties and fill in your values.

spring.datasource.url=jdbc:postgresql://localhost:5432/stockbase
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=please-change-this-to-a-256-bit-secret-before-going-to-production
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:3000

server.port=8080
