# ─── Test profile ────────────────────────────────────────────────────────────
# Integration tests run against an in-memory H2 database in PostgreSQL mode, so
# no external database is required and each test class starts from a clean schema.

spring.datasource.url=jdbc:h2:mem:stockbase_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# A dummy 256-bit secret so JwtUtil can build its signing key in the test context.
app.jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hs256-0123456789
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:3000

management.endpoints.web.exposure.include=health,info
